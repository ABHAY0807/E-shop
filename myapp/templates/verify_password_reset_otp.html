
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verify OTP | E-Shopper</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        .otp-container {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            color: #ff6f61;
            margin-bottom: 12px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 20px;
            text-align: center;
            letter-spacing: 8px;
        }

        input:focus {
            outline: none;
            border-color: #ff6f61;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #ff6f61;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #e85d50;
        }

        .message {
            color: #c0392b;
            text-align: center;
            margin-bottom: 15px;
        }

        .note {
            color: #888;
            text-align: center;
            font-size: 13px;
            margin-top: 18px;
        }
    </style>
</head>

<body>

<div class="otp-container">

    <h2>Verify Your OTP</h2>

    <p class="subtitle">
        Enter the six-digit verification code sent to your registered email.
    </p>

    {% if messages %}
        {% for message in messages %}
            <p class="message">{{ message }}</p>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <label for="otp">Enter OTP</label>

        <input
            type="text"
            id="otp"
            name="otp"
            placeholder="000000"
            inputmode="numeric"
            pattern="[0-9]{6}"
            maxlength="6"
            autocomplete="one-time-code"
            required
        >

        <button type="submit">Verify OTP</button>
    </form>

    <p class="note">
        Your OTP expires after 5 minutes.
    </p>

</div>

</body>
</html>
