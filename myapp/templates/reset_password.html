
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | E-Shopper</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        .password-container {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            color: #ff6f61;
            margin-bottom: 12px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #ff6f61;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #ff6f61;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #e85d50;
        }

        .message {
            color: #c0392b;
            margin-bottom: 15px;
        }

        .help-text {
            color: #777;
            font-size: 12px;
            margin-top: -12px;
            margin-bottom: 18px;
        }
    </style>
</head>

<body>

<div class="password-container">

    <h2>Reset Password</h2>

    <p class="subtitle">
        OTP verified successfully. Create your new password below.
    </p>

    {% if messages %}
        {% for message in messages %}
            <p class="message">{{ message }}</p>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <label for="password1">New Password</label>

        <input
            type="password"
            id="password1"
            name="password1"
            placeholder="Enter new password"
            autocomplete="new-password"
            required
        >

        <p class="help-text">
            Choose a strong password that you have not used before.
        </p>

        <label for="password2">Confirm New Password</label>

        <input
            type="password"
            id="password2"
            name="password2"
            placeholder="Confirm new password"
            autocomplete="new-password"
            required
        >

        <button type="submit">Reset Password</button>
    </form>

</div>

</body>
</html>
