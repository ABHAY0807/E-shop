
{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | E-Shopper</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.1);
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            color: #ff6f61;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777777;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333333;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #dddddd;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #ff6f61;
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .remember-option {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .text-link {
            color: #ff6f61;
            text-decoration: none;
            cursor: pointer;
        }

        .submit-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #ff6f61;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #e85d50;
        }

        .register-text {
            text-align: center;
            margin-top: 25px;
            color: #666666;
            font-size: 14px;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">E-Shopper</div>

        <p class="subtitle">Welcome back! Please log in.</p>
            {% if messages %}
                {% for message in messages %}
                    <p style="color: #c0392b; margin-bottom: 15px; text-align: center;">
                        {{ message }}
                    </p>
                {% endfor %}
            {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label for="username">Username or Email</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username or email"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <div class="form-options">
                <label class="remember-option">
                    <input type="checkbox" name="remember_me">
                    Remember me
                </label>

<a href="{% url 'password_reset' %}" class="text-link">
    Forgot password?
</a>


            </div>

            <button type="submit" class="submit-btn">
                Login
            </button>

            <p class="register-text">
                Don't have an account?
                <a href="{% url 'register' %}" class="text-link">Register</a>
            </p>
        </form>
    </div>
</body>
</html>
