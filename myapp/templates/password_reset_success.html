<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Password Reset Successful | E-Shopper</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }

        .success-container {
            max-width: 420px;
            width: 100%;
            background: white;
            padding: 40px 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.1);
        }

        .success-icon {
            font-size: 55px;
            color: #28a745;
            margin-bottom: 15px;
        }

        h2 {
            color: #28a745;
        }

        p {
            color: #666;
            line-height: 1.6;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 20px;
            background: #ff6f61;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #e85d50;
        }
    </style>
</head>

<body>

<div class="success-container">

    <div class="success-icon">&#10004;</div>

    <h2>Password Reset Successful!</h2>

    <p>
        Your password has been changed successfully.
        You can now log in using your new password.
    </p>

    <form action="{% url 'login' %}" method="GET">
        <button type="submit">Go to Login</button>
    </form>

</div>

</body>
</html>
