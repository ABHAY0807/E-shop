{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Admin Panel Login | EShopper</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link href="{% static 'img/favicon.ico' %}" rel="icon">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="{% static 'css/style.css' %}?v=1" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0c2340 0%, #1e3c72 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Poppins', sans-serif;
        }

        .admin-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: 440px;
            overflow: hidden;
        }

        .admin-header {
            background: #0c2340;
            padding: 30px 25px;
            text-align: center;
            color: #ffffff;
        }
    </style>
</head>

<body>

    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="admin-card">
                    <div class="admin-header">
                        <div class="d-inline-flex align-items-center justify-content-center bg-primary text-white rounded-circle mb-3" style="width: 60px; height: 60px;">
                            <i class="fa fa-user-shield fa-2x"></i>
                        </div>
                        <h4 class="font-weight-bold text-white mb-1">EShopper Admin Portal</h4>
                        <p class="text-light small mb-0">Management &amp; Inventory Dashboard</p>
                    </div>

                    <div class="p-4 p-md-5">
                        {% if messages %}
                            {% for message in messages %}
                                <div class="alert alert-{{ message.tags }} alert-dismissible fade show small mb-3" role="alert">
                                    {{ message }}
                                    <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                                        <span aria-hidden="true">&times;</span>
                                    </button>
                                </div>
                            {% endfor %}
                        {% endif %}

                        <form method="POST" action="{% url 'admin_panel_login' %}">
                            {% csrf_token %}
                            <div class="form-group mb-3">
                                <label class="small font-weight-bold text-dark">Admin Username or Email</label>
                                <div class="input-group">
                                    <div class="input-group-prepend">
                                        <span class="input-group-text bg-light border-right-0"><i class="fa fa-user text-muted"></i></span>
                                    </div>
                                    <input type="text" name="username" class="form-control border-left-0" placeholder="admin or email" required autofocus>
                                </div>
                            </div>

                            <div class="form-group mb-4">
                                <label class="small font-weight-bold text-dark">Password</label>
                                <div class="input-group">
                                    <div class="input-group-prepend">
                                        <span class="input-group-text bg-light border-right-0"><i class="fa fa-lock text-muted"></i></span>
                                    </div>
                                    <input type="password" name="password" class="form-control border-left-0" placeholder="••••••••" required>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary btn-block py-3 font-weight-bold shadow-sm mb-3">
                                <i class="fa fa-sign-in-alt mr-2"></i> Access Admin Dashboard
                            </button>
                        </form>

                        <div class="text-center pt-2 border-top">
                            <a href="{% url 'index' %}" class="small text-muted">
                                <i class="fa fa-arrow-left mr-1"></i> Return to EShopper Store
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.bundle.min.js"></script>
</body>

</html>
