
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - EShopper</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .register-box {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #d19c97;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #bd827d;
        }

        .message {
            color: #c0392b;
            margin-bottom: 15px;
        }

        .login-text {
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="register-box">
        <h2>Create Account</h2>

        {% if messages %}
            {% for message in messages %}
                <p class="message">{{ message }}</p>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter username"
                autocomplete="username"
                required
            >

            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter email address"
                autocomplete="email"
                required
            >

            <label for="password1">Password</label>
            <input
                type="password"
                id="password1"
                name="password1"
                placeholder="Create password"
                autocomplete="new-password"
                required
            >

            <label for="password2">Confirm Password</label>
            <input
                type="password"
                id="password2"
                name="password2"
                placeholder="Confirm password"
                autocomplete="new-password"
                required
            >

            <button type="submit">Register</button>
        </form>

<div class="login-text">
    Already have an account?
    <a href="{% url 'login' %}" style="color: #d19c97; text-decoration: none;">
        Login
    </a>
</div>

    </div>

</body>
</html>
