<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 40px auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
        }

        .product {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
            transition: 0.3s;
        }

        .product:hover {
            transform: translateY(-5px);
        }

        .product img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
        }

        .product-info {
            padding: 18px;
        }

        .product-info h2 {
            font-size: 20px;
            margin-bottom: 8px;
        }

        .subcategory {
            color: #777;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .price {
            font-size: 18px;
            font-weight: bold;
        }

        .no-image {
            height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ddd;
            color: #666;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Our Products</h1>

        <div class="products">

            {% for product in products %}

            <div class="product">

                {% if product.image %}
                    <img src="{{ product.image.url }}" alt="{{ product.name }}">
                {% else %}
                    <div class="no-image">
                        No Image
                    </div>
                {% endif %}

                <div class="product-info">

                    <h2>{{ product.name }}</h2>

                    <p class="subcategory">
                        {{ product.subcategory.name }}
                    </p>

                    <p class="price">
                        ₹{{ product.price }}
                    </p>

                </div>

            </div>

            {% empty %}

            <p>No products available.</p>

            {% endfor %}

        </div>

    </div>

</body>
</html>
